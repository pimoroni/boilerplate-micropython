name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Build Packages
        run: uv build

      - name: Check version matches tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          BUILT="$(ls dist/*.whl | head -1 | cut -d- -f2)"
          JSON="$(python3 -c "import json; print(json.load(open('package.json'))['version'])")"
          echo "tag=$TAG built=$BUILT package.json=$JSON"
          if [ "$GITHUB_REF_NAME" != "$TAG" ] && [ "$TAG" != "$BUILT" ]; then
            echo "::error::built $BUILT from tag $TAG"
            exit 1
          fi
          if [ "$JSON" != "$BUILT" ]; then
            echo "::error::package.json is $JSON, built $BUILT"
            exit 1
          fi

      - name: Publish
        run: uv publish --trusted-publishing always
